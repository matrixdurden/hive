# winloom: matrixdurden'in Windows araçları. Tek workspace, tek derleme çıktısı (target/).
#   app/            winloom.exe: pencere, araç sayfaları; soundboard motoru ve duvar kâğıdı motoru içinde
#   soundboard/     soundboard motoru (kütüphane) ve mikrofon efekti (apo/, DLL)
#   wallpaper/      duvar kâğıdı motoru (ayrı süreç, winloom diske yazıp başlatır)
[workspace]
members = ["app", "soundboard", "soundboard/apo", "wallpaper"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
