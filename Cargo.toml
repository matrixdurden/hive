# winloom: matrixdurden'in Windows araçları. Tek workspace, tek derleme çıktısı (target/).
#   merkez/         winloom.exe: pencere, tepsi, araçları açma / kapatma, güncelleme, kurulum
#   ortak/          bütün araçların paylaştığı kod: çizim, arayüz parçaları, log, ağ, dil, araç tanımı
#   araclar/<id>/   her araç kendi klasöründe: sayfası (src/), ikonu (ikon/), varsa motoru (motor/)
# Yeni araç eklemek: ARAC-EKLEME.md.
[workspace]
members = ["merkez", "ortak", "araclar/*", "araclar/soundboard/motor", "araclar/soundboard/apo", "araclar/wallpaper/motor"]
resolver = "3"

# winloom'ın bütün crate'leri aynı sürümle çıkar (merkez, ortak, araçlar); motorların kendi sürümü var.
[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ortak = { path = "ortak" }
windows-numerics = "0.3"
windows-core = "0.62"

# Hepsi tek exe'de birleştiğinden özellikler zaten birleşir: tek liste, her crate `windows.workspace = true`.
[workspace.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation_Collections",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
