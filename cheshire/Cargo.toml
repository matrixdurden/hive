[package]
name = "cheshire"
version = "0.1.0"
edition = "2024"
description = "Hafif, açık kaynak, GPU tabanlı canlı duvar kâğıdı motoru (Windows)"
license = "MIT"
# Otomatik güncelleme bu reponun GitHub Releases sayfasına bakar.
repository = "https://github.com/matrixdurden/cheshire"

[dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl", "naga-ir"] }
naga = { version = "30", features = ["glsl-in"] }
raw-window-handle = "0.6"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
